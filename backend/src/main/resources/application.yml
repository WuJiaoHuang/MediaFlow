server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: mediaflow
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mediaflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:101MB}
  jackson:
    time-zone: Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
mediaflow:
  storage-root: ${STORAGE_ROOT:./uploads}
  feedback-audio-max-bytes: ${FEEDBACK_AUDIO_MAX_BYTES:10485760}
  feedback-video-max-bytes: ${FEEDBACK_VIDEO_MAX_BYTES:26214400}
  max-file-bytes: ${MAX_FILE_BYTES:104857600}
  jwt-secret: ${JWT_SECRET}
  token-ttl-seconds: ${TOKEN_TTL_SECONDS:1800}
logging:
  level:
    root: INFO
    com.mediaflow: INFO
springdoc:
  swagger-ui:
    path: /swagger-ui.html
