spring:
  datasource:
    url: jdbc:h2:mem:mediaflow;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql,classpath:media-schema.sql,classpath:task-schema.sql,classpath:feedback-schema.sql
mediaflow:
  jwt-secret: test-only-random-looking-secret-not-for-deployment-0123456789
  token-ttl-seconds: 1800

  storage-root: ./target/test-uploads
  max-file-bytes: 1048576
